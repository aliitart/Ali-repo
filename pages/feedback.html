<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Tempo</title>
    <link id="favicon" rel="icon" href="/favicon.ico" type="image/ico">
    <link rel='stylesheet' href='style.css' />
    <link rel='stylesheet' href='styleForm.css' />
</head>

<body>
    <header>
        <div class="head-container">
            <div class="title-bar">
                <div class="logo">
                    <img src="/logo.jpg" width="100" height="100" alt="logo">
                </div>

                <h1 class="tempo-title">Tempo Feedback</h1>

                <div class="logo">
                    <img src="/logo.jpg" width="100" height="100" alt="logo">
                </div>
            </div>

            <div class="nav-container">
                <ul>
                    <li><a href="/home">Home</a></li>
                    <li><a href="/account">My Account</a></li>
                    <li><a href="/album">Media</a></li>
                    <li><a href="/application">Apply</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="content">

        <p class="about">
            Thank you for visiting our website, if you have any feedback please let us know in the form below.
            <br>
            <br>
        </p>

        <div class="form">
            <form action="/thanks" method="post" class="upload-files" enctype="multipart/form-data">
                <table>
                    <caption class="formTitle"><b>Feedback Form<b></caption>
                    <tr>
                        <td><label for="fname">Name:</label></td>
                        <td><input type="text" name="name" id="fname" required></td>
                    </tr>
                    <tr>
                        <td><label for="uname">Date of birth:</label></td>
                        <td><input type="date" name="dob" id="dob" required></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email Address:</label></td>
                        <td><input type="email" name="email" id="email" required></td>
                    </tr>
                    <tr>
                        <td><label for="phone">Phone Number:</label></td>
                        <td><input type="tel" name="phone" id="phone"></td>
                    </tr>
                    <tr>
                        <td colspan="3" class="other-label">Anything that you would like us to know?<label
                                for="request"></label></td>
                    </tr>
                    <tr>
                        <td colspan="2"><textarea name="comments" rows="10"></textarea></td>
                    </tr>
                    <tr>
                        <td colspan="2" class="form-buttons">
                            <button type="submit">Submit</button>
                            <button type="reset">Reset</button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>

    <footer class="foot">
        <i><b>&copy Alison Paredes - Advanced Internet Programming - 2026 </b><i>
    </footer>
</body>
</html>
