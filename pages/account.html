<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Tempo</title>
    <link id="favicon" rel="icon" href="/favicon.ico" type="image/ico">
    <link rel='stylesheet' href='style.css' />
    <link rel='stylesheet' href='styleLogin.css' />
</head>

<body>
    <header>
        <div class="head-container">
            <div class="title-bar">
                <div class="logo">
                    <img src="/logo.jpg" width="100" height="100" alt="logo">
                </div>

                <h1 class="tempo-title">My Tempo Account</h1>

                <div class="logo">
                    <img src="/logo.jpg" width="100" height="100" alt="logo">
                </div>
            </div>

            <div class="nav-container">
                <ul>
                    <li><a href="/home">Home</a></li>
                    <li><a href="/album">Media</a></li>
                    <li><a href="/application">Apply</a></li>
                    <li><a href="/feedback">Feedback</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="content">
        <button class="tittles" id="login-button">Log in / Sign up</button>

        <div id="login-form" class="shown hidden">
            <form method="post" action="/login" class="form" id="login">
                <table>
                    <tr>
                        <td colspan="2">
                            <h2 class="formTitle"><span class="close-button">&times;</span> Log in</h2>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" name="email" id="email" placeholder="Email" required></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td><input type="password" name="psw" placeholder="Password" required></td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <p id="message"></p>
                    </tr>
                    <tr>
                        <td colspan="2" class="form-buttons">
                            <button type="submit">Log in</button>
                            <button type="button" id="signup-button">Sign Up</button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <div id="signup-form" class="hidden shown">
            <form method="post" action="/login" class="form">
                <table>
                    <tr>
                        <td colspan="2">
                            <h2 class="formTitle"><span class="close-button">&times;</span> Sign Up</h2>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="user">User name:</label></td>
                        <td><input type="text" name="user" id="user" placeholder="*grey*" required></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" name="email" id="email" placeholder="Email" required></td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <p id="message"></p>
                    </tr>
                    <tr>
                        <td colspan="2" class="form-buttons">
                            <button type="button" id="create-button">Create Account</button>
                            <button type="button" id="login-swap">Log in</button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>

    <footer class="foot">
        <i><b>&copy Alison Paredes - Advanced Internet Programming - 2026 </b><i>
    </footer>
</body>
<script>

    const logform = document.getElementById('login-form');
    const logbutton = document.getElementById('login-button');

    const signform = document.getElementById('signup-form');
    const signbutton = document.getElementById('signup-button');

    const swapbutton = document.getElementById('login-swap');

    //hide and show login form as the button is clicked
    logbutton.addEventListener('click', () => {
        logform.classList.toggle('hidden');
    });


    //show sign up form once the "sign up" button is clicked
    signbutton.addEventListener('click', () => {
        logform.classList.toggle('hidden');
        signform.classList.toggle('hidden');
    });

    //go back to sign in form
    swapbutton.addEventListener('click', () => {
        signform.classList.toggle('hidden');
        logform.classList.toggle('hidden');
    })

    //close the form once "x" button is clicked
    const closeB = document.querySelectorAll('.close-button');
    closeB.forEach(button => {
        button.addEventListener('click', () => {
            logform.classList.add('hidden');
            signform.classList.add('hidden');

        })
    })

    const createB = document.getElementById('create-button');

    createB.addEventListener('click', () => {
        signform.classList.toggle('hidden');
    });


    //prevent form to submit instead check if log in is correct
    document.getElementById("login").addEventListener("submit", (event) => {
        event.preventDefault()

        const formData = new FormData(event.target)
        const urlEncoded = new URLSearchParams(formData)
        let ajaxReq = new XMLHttpRequest()

        //display message once password is entered 
        ajaxReq.addEventListener("load", () => {
            let res = JSON.parse(ajaxReq.responseText)
            document.getElementById("message").innerHTML = res.message
            event.target.reset();
        })

        //define an end point where we are serving the form
        ajaxReq.open("POST", "/login")

        //content type will be url encoded
        ajaxReq.setRequestHeader("Content-Type", "application/x-www-form-urlencoded")

        //headers are set, now set the body
        ajaxReq.send(urlEncoded)

    })
</script>

</html>
